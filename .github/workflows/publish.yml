name: Publish to PyPI

# Publishes the built sdist + wheel to PyPI on every GitHub release.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored as GitHub
# secrets. The project must be registered on PyPI with a trusted
# publisher pointing at this exact workflow:
#
#   Project:     ctrlrelay
#   Owner:       AInvirion
#   Repository:  ctrlrelay
#   Workflow:    publish.yml
#   Environment: pypi
#
# Publishing is intentionally automatic: tag, publish the GitHub
# release, and this ships to PyPI with no human step. The `pypi`
# environment scopes the OIDC trust to this workflow — it is NOT an
# approval gate and carries no protection rules. Anything that can
# publish a release here can publish to PyPI.
#
# (This comment previously claimed the environment paused for a
# maintainer. It never did, and someone reading it planned a release
# around a checkpoint that was not there. If a gate is ever wanted,
# it is a required reviewer on the `pypi` environment in repo
# settings — not something this file can assert.)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ctrlrelay/
    permissions:
      id-token: write   # required for OIDC token exchange with PyPI

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
